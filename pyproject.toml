[project]
name = "yt-collate"
version = "0.0.3"
description = "Efficient, well-rounded YouTube Music TUI client"
readme = "README.md"
authors = [
    { name = "indigo0445" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "textual>=2.0.0",
    "ytmusicapi>=1.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pypresence>=4.3.0",
]

[project.urls]
GitHub = "https://github.com/indigo0445/yt-collate"

[project.scripts]
yt-collate = "cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app", "cli", "keyhints", "state", "utils"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
themes = ["*.tcss"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "app",
    "cli",
    "keyhints",
    "models",
    "screens",
    "services",
    "state",
    "utils",
    "widgets",
]
